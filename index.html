<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ściąga radiowa — LSPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#f2f3f5;
  --card:#ffffff;
  --ink:#1a1e23;
  --ink-soft:#5c656f;
  --ink-faint:#8b939c;
  --rule:#dadee3;
  --navy:#22364c;
  --navy-soft:#e7edf4;
  --fill:#8a6a17;
  --fill-bg:#fbf4e0;
  --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
  --chip-ink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171b; --card:#1b1f25; --ink:#e5e8ec; --ink-soft:#9aa3ad; --ink-faint:#737c86;
    --rule:#2d333b; --navy:#a4c3e6; --navy-soft:#222a34; --fill:#d6b25f; --fill-bg:#2a2517;
    --chip-ink:#14171b;
  }
}
:root[data-theme="dark"]{
  --paper:#14171b; --card:#1b1f25; --ink:#e5e8ec; --ink-soft:#9aa3ad; --ink-faint:#737c86;
  --rule:#2d333b; --navy:#a4c3e6; --navy-soft:#222a34; --fill:#d6b25f; --fill-bg:#2a2517;
  --chip-ink:#14171b;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

header{
  position:sticky;top:0;z-index:20;
  background:var(--card);border-bottom:1px solid var(--rule);
}
.head{
  max-width:1120px;margin:0 auto;padding:13px 24px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.head p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft)}
.ident{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.ident .f{display:flex;flex-direction:column;gap:4px}
.ident label{font-size:11.5px;color:var(--ink-soft);font-weight:500}
.ident input{
  font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:3px;
  padding:7px 9px;width:112px;outline:none;
}
.ident input:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft)}
.ident input::placeholder{color:var(--ink-faint);font-weight:400}

.hint-bar{background:var(--fill-bg);border-bottom:1px solid var(--rule)}
.hint-bar .in{max-width:1120px;margin:0 auto;padding:9px 24px;font-size:13px;color:var(--fill)}

.wrap{max-width:1120px;margin:0 auto;padding:26px 24px 80px;display:flex;gap:36px;align-items:flex-start}
nav.toc{
  width:206px;flex-shrink:0;position:sticky;top:96px;
  max-height:calc(100vh - 130px);overflow-y:auto;
}
nav.toc h2{font-size:11.5px;font-weight:600;color:var(--ink-faint);margin:0 0 8px;padding-left:9px}
nav.toc a{
  display:block;padding:5px 9px;font-size:13px;color:var(--ink-soft);
  text-decoration:none;border-left:2px solid transparent;border-radius:0 3px 3px 0;
}
nav.toc a:hover{color:var(--ink);background:var(--card)}
nav.toc a.on{color:var(--navy);border-left-color:var(--navy);background:var(--card);font-weight:500}

main{flex:1;min-width:0}

.search{margin-bottom:8px}
.search input{
  width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:11px 13px;outline:none;
}
.search input:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft)}
.meta{font-size:12.5px;color:var(--ink-soft);margin:9px 2px 24px}

section{margin-bottom:38px}
section > h2{
  font-size:17px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;
}
section > .lead{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px}

.block{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:14px 16px;margin-bottom:9px;
}
.block > h3{
  font-size:12.5px;font-weight:600;color:var(--navy);margin:0 0 10px;
}
.block.prose{font-size:14.5px;color:var(--ink-soft)}
.block.prose p{margin:0 0 9px}
.block.prose p:last-child{margin:0}
.block.prose strong{color:var(--ink);font-weight:600}

ul.plain{margin:0;padding-left:18px;font-size:14.5px;color:var(--ink-soft)}
ul.plain li{margin-bottom:5px}
ul.plain li:last-child{margin:0}
ol.plain{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-soft)}
ol.plain li{margin-bottom:5px}

dl.defs{margin:0;display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:6px 16px;font-size:14px}
dl.defs dt{font-family:var(--mono);font-weight:600;color:var(--navy)}
dl.defs dd{margin:0;color:var(--ink-soft)}

.line{
  display:flex;align-items:flex-start;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--rule);
}
.line:last-child{border-bottom:none;padding-bottom:0}
.line:first-of-type{padding-top:0}
.txt{
  flex:1;font-family:var(--mono);font-size:13.5px;line-height:1.5;word-break:break-word;
}
.txt .sub{background:var(--navy-soft);color:var(--navy);border-radius:2px;padding:0 3px;font-weight:600}
.txt .ph{background:var(--fill-bg);color:var(--fill);border-radius:2px;padding:0 3px}
.txt .fill{color:var(--ink-faint)}
.copy{
  flex-shrink:0;font-family:var(--sans);font-size:12px;font-weight:500;
  color:var(--ink-faint);background:transparent;border:1px solid var(--rule);
  border-radius:3px;padding:3px 9px;cursor:pointer;line-height:1.5;
}
.copy:hover{color:var(--navy);border-color:var(--navy)}
.copy:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.copy.done{color:var(--navy);border-color:var(--navy)}


.empty{font-size:14.5px;color:var(--ink-soft);padding:30px 2px}

footer{border-top:1px solid var(--rule);margin-top:20px;padding-top:14px;font-size:12.5px;color:var(--ink-faint)}

@media (max-width:860px){
  nav.toc{display:none}
  .wrap{padding:20px 16px 56px;gap:0}
  .head{padding:12px 16px}
  .hint-bar .in{padding:9px 16px}
  .ident{width:100%}
  .ident .f{flex:1;min-width:98px}
  .ident input{width:100%}
  .line{flex-direction:column;gap:6px}
  .copy{align-self:flex-start}
}

@media print{
  header,nav.toc,.search,.copy,.hint-bar,footer{display:none}
  body{background:#fff;font-size:11pt}
  .block{border:none;padding:0 0 8px;break-inside:avoid}
  .wrap{display:block;padding:0}
  section{break-inside:avoid-page}
}
</style>
</head>
<body>

<header>
  <div class="head">
    <div>
      <h1>Ściąga radiowa — LSPD</h1>
      <p>Wpisz swoje dane raz, a podstawią się w każdym komunikacie.</p>
    </div>
    <div class="ident">
      <div class="f">
        <label for="i-cs">Callsign</label>
        <input id="i-cs" type="text" placeholder="13A21" autocomplete="off" spellcheck="false">
      </div>
      <div class="f">
        <label for="i-badge">Nr odznaki</label>
        <input id="i-badge" type="text" placeholder="4521" autocomplete="off" spellcheck="false">
      </div>
      <div class="f">
        <label for="i-name">Nazwisko</label>
        <input id="i-name" type="text" placeholder="Stanley" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
</header>

<div class="hint-bar" id="hintbar">
  <div class="in">Uzupełnij pola u góry — dopóki są puste, w komunikatach widać same znaczniki.</div>
</div>

<div class="wrap">
  <nav class="toc" id="toc" aria-label="Spis treści"><h2>Spis treści</h2></nav>

  <main>
    <div class="search">
      <input id="q" type="text" placeholder="Szukaj: backup, pościg zmotoryzowany, kod 6, offduty…" autocomplete="off">
    </div>
    <div class="meta" id="meta"></div>
    <div id="out"></div>
    <footer>
      Dane zapisują się wyłącznie w tej przeglądarce. Żółte pola w nawiasach uzupełniasz sam przed nadaniem.
    </footer>
  </main>
</div>

var $ = function(id){ return document.getElementById(id); };
var elCs = $('i-cs'), elBadge = $('i-badge'), elName = $('i-name');
var elQ = $('q'), elOut = $('out'), elMeta = $('meta'), elToc = $('toc'), elHint = $('hintbar');

function read(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function write(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var IDENT = {
  '[CALLSIGN]':  function(){ return elCs.value.trim(); },
  '[NRODZNAKI]': function(){ return elBadge.value.trim(); },
  '[NAZWISKO]':  function(){ return elName.value.trim(); }
};

function toPlain(text){
  return text.replace(/\[[^\]]+\]/g, function(tok){
    var f = IDENT[tok];
    if(!f) return tok;
    return f() || tok;
  });
}

function toHtml(text){
  return text.replace(/\[[^\]]+\]/g, function(tok){
    var f = IDENT[tok];
    if(f){
      var v = f();
      return v
        ? '<span class="sub">' + esc(v) + '</span>'
        : '<span class="ph">' + esc(tok) + '</span>';
    }
    return '<span class="fill">' + esc(tok) + '</span>';
  });
}

function lineHtml(text){
  return '<div class="line">'
    + '<div class="txt">' + toHtml(text) + '</div>'
    + '<button class="copy" type="button" data-src="' + esc(text) + '">Kopiuj</button>'
    + '</div>';
}

function blockHtml(b, q){
  var head = b.h ? '<h3>' + esc(b.h) + '</h3>' : '';

  if(b.t === 'lines'){
    var hits = b.lines.filter(function(l){ return !q || l.toLowerCase().indexOf(q) !== -1; });
    if(!hits.length) return '';
    return '<div class="block">' + head + hits.map(lineHtml).join('') + '</div>';
  }
  if(q) return '';

  if(b.t === 'prose') return '<div class="block prose">' + head + b.html + '</div>';
  if(b.t === 'ul')
    return '<div class="block">' + head + '<ul class="plain">' + b.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
  if(b.t === 'ol')
    return '<div class="block">' + head + '<ol class="plain">' + b.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ol></div>';
  if(b.t === 'defs')
    return '<div class="block">' + head + '<dl class="defs">' + b.rows.map(function(r){
      return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
    }).join('') + '</dl></div>';
  return '';
}

function countLines(){
  var n = 0;
  GROUPS.forEach(function(g){
    g.blocks.forEach(function(b){ if(b.t === 'lines') n += b.lines.length; });
  });
  return n;
}
var TOTAL = countLines();

function render(){
  var q = elQ.value.trim().toLowerCase();
  var html = '', shown = 0;

  GROUPS.forEach(function(g){
    var body = g.blocks.map(function(b){ return blockHtml(b, q); }).join('');
    if(!body) return;
    if(q){
      g.blocks.forEach(function(b){
        if(b.t === 'lines') shown += b.lines.filter(function(l){ return l.toLowerCase().indexOf(q) !== -1; }).length;
      });
    }
    html += '<section id="s-' + g.id + '">'
      + '<h2>' + esc(g.title) + '</h2>'
      + (g.lead && !q ? '<p class="lead">' + esc(g.lead) + '</p>' : '')
      + body + '</section>';
  });

  if(!html){
    html = '<div class="empty">Nic nie pasuje do „' + esc(elQ.value.trim()) + '”.</div>';
    elMeta.textContent = '';
  } else {
    elMeta.textContent = q ? (shown + ' z ' + TOTAL + ' komunikatów') : (TOTAL + ' komunikatów w ' + GROUPS.length + ' sekcjach');
  }
  elOut.innerHTML = html;
}

function buildToc(){
  elToc.insertAdjacentHTML('beforeend', GROUPS.map(function(g){
    return '<a href="#s-' + g.id + '" data-id="s-' + g.id + '">' + esc(g.title) + '</a>';
  }).join(''));
}

function markToc(){
  var links = elToc.querySelectorAll('a');
  var best = null, bestTop = -Infinity;
  links.forEach(function(a){
    var sec = document.getElementById(a.getAttribute('data-id'));
    if(!sec) return;
    var top = sec.getBoundingClientRect().top - 130;
    if(top <= 0 && top > bestTop){ bestTop = top; best = a; }
  });
  links.forEach(function(a){ a.classList.toggle('on', a === best); });
}

function onIdent(){
  write('lspd_cs', elCs.value.trim());
  write('lspd_badge', elBadge.value.trim());
  write('lspd_name', elName.value.trim());
  elHint.style.display = (elCs.value.trim() && elBadge.value.trim()) ? 'none' : 'block';
  render();
}

[elCs, elBadge, elName].forEach(function(i){ i.addEventListener('input', onIdent); });
elQ.addEventListener('input', render);

elOut.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.copy') : null;
  if(!btn) return;
  var text = toPlain(btn.getAttribute('data-src'));
  var done = function(){
    btn.textContent = 'Skopiowano';
    btn.classList.add('done');
    setTimeout(function(){ btn.textContent = 'Kopiuj'; btn.classList.remove('done'); }, 1100);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
  } else {
    fallback(text, done);
  }
});

function fallback(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

var ticking = false;
window.addEventListener('scroll', function(){
  if(ticking) return;
  ticking = true;
  window.requestAnimationFrame(function(){ markToc(); ticking = false; });
}, {passive:true});

elCs.value = read('lspd_cs');
elBadge.value = read('lspd_badge');
elName.value = read('lspd_name');
elHint.style.display = (elCs.value.trim() && elBadge.value.trim()) ? 'none' : 'block';
buildToc();
render();
markToc();

})();
</script>
